name: Build and Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAURI_CLI_VERSION: 2.12.4

jobs:
  check:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7

    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - uses: Swatinem/rust-cache@v2

    - name: Version matches the tag
      if: startsWith(github.ref, 'refs/tags/')
      shell: bash
      run: |
        version=$(jq -r .version src-tauri/tauri.conf.json)
        cargo_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "rewards-autoplay") | .version')
        if [ "v$version" != "$GITHUB_REF_NAME" ] || [ "$version" != "$cargo_version" ]; then
          echo "::error::Tag $GITHUB_REF_NAME, tauri.conf.json $version and Cargo.toml $cargo_version must match"
          exit 1
        fi

    - name: Format
      run: cargo fmt --all --check

    - name: Clippy
      run: cargo clippy --workspace --all-targets -- -D warnings

    - name: Tests
      run: cargo test --workspace

  # Builds on main and pull requests: an installer to try, without updater signature.
  bundle:
    needs: check
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7

    - uses: dtolnay/rust-toolchain@stable

    - uses: Swatinem/rust-cache@v2

    - uses: actions/setup-node@v7
      with:
        node-version: 22

    - name: Bundle
      shell: bash
      run: |
        echo '{"bundle": {"createUpdaterArtifacts": false}}' > "$RUNNER_TEMP/no-updater.json"
        npx --yes "@tauri-apps/cli@$TAURI_CLI_VERSION" build --config "$RUNNER_TEMP/no-updater.json"

    - uses: actions/upload-artifact@v7
      with:
        name: bundle-windows
        path: target/release/bundle/nsis/*.exe
        if-no-files-found: error

  # Catches a wrong private key before a release is published with it.
  updater-key:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version: 22

    - name: Private key matches the public key
      run: |
        if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
          echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY is missing (see README)"
          exit 1
        fi
        sudo apt-get update && sudo apt-get install -y minisign
        echo probe > "$RUNNER_TEMP/probe.txt"
        npx --yes "@tauri-apps/cli@$TAURI_CLI_VERSION" signer sign "$RUNNER_TEMP/probe.txt"
        base64 -d "$RUNNER_TEMP/probe.txt.sig" > "$RUNNER_TEMP/probe.minisig"
        pubkey=$(jq -r .plugins.updater.pubkey src-tauri/tauri.conf.json | base64 -d | sed -n 2p)
        minisign -V -P "$pubkey" -m "$RUNNER_TEMP/probe.txt" -x "$RUNNER_TEMP/probe.minisig"

  release:
    needs: [check, updater-key]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: write  # create the GitHub release
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
    - uses: actions/checkout@v7

    - uses: dtolnay/rust-toolchain@stable

    - uses: Swatinem/rust-cache@v2

    - uses: actions/setup-node@v7
      with:
        node-version: 22

    # createUpdaterArtifacts makes Tauri sign the NSIS installer (.sig next to it).
    - name: Build the installer
      shell: bash
      run: |
        npx --yes "@tauri-apps/cli@$TAURI_CLI_VERSION" build
        mkdir dist
        cp target/release/bundle/nsis/*-setup.exe dist/RewardsAutoplay_Setup.exe
        cp target/release/bundle/nsis/*-setup.exe.sig dist/RewardsAutoplay_Setup.exe.sig

    # latest.json is read by the in-app updater (plugins.updater.endpoints).
    - name: Checksums and updater manifest
      shell: bash
      working-directory: dist
      run: |
        sha256sum RewardsAutoplay_Setup.exe > SHA256SUMS.txt
        base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
        jq -n \
          --arg version "${GITHUB_REF_NAME#v}" \
          --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          --arg notes "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}" \
          --arg sig "$(cat RewardsAutoplay_Setup.exe.sig)" --arg url "$base/RewardsAutoplay_Setup.exe" \
          '{version: $version, notes: $notes, pub_date: $date, platforms: {
             "windows-x86_64": {signature: $sig, url: $url}}}' > latest.json
        cat latest.json SHA256SUMS.txt

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          dist/RewardsAutoplay_Setup.exe
          dist/SHA256SUMS.txt
          dist/latest.json
        generate_release_notes: true
        body: |
          ## Installation
          Téléchargez `RewardsAutoplay_Setup.exe` et lancez-le. Les versions déjà installées se mettent à jour depuis l'application (Paramètres › Mises à jour, ou le menu de l'icône dans la zone de notification).

          L'installateur n'est pas signé (Authenticode) : au premier téléchargement, SmartScreen peut demander de cliquer sur **Informations complémentaires › Exécuter quand même**. Les mises à jour installées depuis l'application sont vérifiées avec la clé du projet.

<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rewards Autoplay</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="mini.css">
</head>
<body class="mini">
  <div class="mini-head">
    <div>
      <div class="mini-points"><span id="m-points">—</span><small>points</small></div>
      <div class="muted small" id="m-level"></div>
    </div>
    <button class="icon-btn" id="m-refresh" type="button" title="Actualiser" aria-label="Actualiser">↻</button>
  </div>
  <div class="mini-body" id="m-body" aria-live="polite"></div>
  <div class="mini-foot">
    <button class="btn primary" id="m-guided" type="button">Faire mes tâches ▸</button>
    <button class="btn" id="m-open" type="button">Ouvrir</button>
  </div>
  <script src="mini.js"></script>

</html>
